name: Temporary format text audit

on:
  push:
    branches:
      - release/text-audit

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: packages/room_scanner_app
      - name: Format audited files
        run: dart format packages/room_scanner_app/lib/screens/basic_scanner_screen.dart packages/room_scanner_app/lib/screens/measurement_editor_screen.dart
      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/room_scanner_app/lib/screens/basic_scanner_screen.dart packages/room_scanner_app/lib/screens/measurement_editor_screen.dart
          git commit -m "style: format audited Dart files"
          git push
