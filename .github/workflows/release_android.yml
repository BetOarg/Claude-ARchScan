name: ARchScan - Android Store Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.0"
  JAVA_VERSION: "17"
  ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
  ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

jobs:
  build-android-store:
    name: Signed Android App Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          missing=0
          for variable in ANDROID_KEYSTORE_BASE64 ANDROID_STORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!variable}" ]; then
              echo "::error::Falta el secret $variable"
              missing=1
            fi
          done
          exit "$missing"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Generate core models
        working-directory: packages/room_scanner_core
        run: |
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs

      - name: Prepare app and audit repository before signing
        working-directory: packages/room_scanner_app
        run: |
          flutter pub get
          flutter gen-l10n
          dart run tool/verify_store_readiness.dart --strict
          dart run tool/security_audit.dart

      - name: Generate Gradle wrapper
        working-directory: packages/room_scanner_app/android
        run: gradle --no-daemon wrapper --gradle-version 8.14

      - name: Prepare signing
        working-directory: packages/room_scanner_app
        shell: bash
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          {
            echo "storeFile=../upload-keystore.jks"
            echo "storePassword=$ANDROID_STORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties

      - name: Validate production signing
        working-directory: packages/room_scanner_app/android
        run: gradle --no-daemon :app:verifyProductionSigning

      - name: Build signed App Bundle
        working-directory: packages/room_scanner_app
        run: flutter build appbundle --release

      - name: Verify final App Bundle signature
        working-directory: packages/room_scanner_app
        shell: bash
        run: |
          set -euo pipefail
          aab="build/app/outputs/bundle/release/app-release.aab"
          report="build/store-audit"
          mkdir -p "$report"

          test -s "$aab"
          if ! unzip -Z1 "$aab" | grep -E "META-INF/.*[.]RSA$|META-INF/.*[.]DSA$|META-INF/.*[.]EC$" >/dev/null; then
            echo "::error::El AAB no contiene un bloque de firma"
            exit 1
          fi

          if ! jarsigner -verify -verbose -certs "$aab" > "$report/jarsigner-verification.txt" 2>&1; then
            cat "$report/jarsigner-verification.txt"
            echo "::error::La firma del AAB no se pudo verificar"
            exit 1
          fi

          if ! keytool -printcert -jarfile "$aab" -v > "$report/signer-certificate.txt" 2>&1; then
            cat "$report/signer-certificate.txt"
            echo "::error::No se pudo extraer el certificado firmante del AAB"
            exit 1
          fi

          if ! grep -Fq "SHA256:" "$report/signer-certificate.txt"; then
            echo "::error::El certificado firmante no expone una huella SHA-256"
            exit 1
          fi

          echo "Firma del AAB verificada; certificado y huella guardados en el informe."

      - name: Audit final App Bundle
        working-directory: packages/room_scanner_app
        shell: bash
        run: |      - name: Validate AAB ZIP alignment with bundletool
        working-directory: packages/room_scanner_app
        shell: bash
        run: |
          set -euo pipefail
          aab="build/app/outputs/bundle/release/app-release.aab"
          report="build/store-audit"
          bundletool_version="1.18.3"
          bundletool_jar="build/bundletool-all-${bundletool_version}.jar"
          expected_sha256="a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29"

          curl --fail --location --silent --show-error \
            "https://github.com/google/bundletool/releases/download/${bundletool_version}/bundletool-all-${bundletool_version}.jar" \
            --output "$bundletool_jar"

          actual_sha256="$(sha256sum "$bundletool_jar" | awk '{print $1}')"
          if [ "$actual_sha256" != "$expected_sha256" ]; then
            echo "::error::La SHA-256 de bundletool ${bundletool_version} no coincide"
            echo "Esperada: $expected_sha256"
            echo "Obtenida: $actual_sha256"
            exit 1
          fi

          java -jar "$bundletool_jar" version | tee "$report/bundletool-version.txt"

          java -jar "$bundletool_jar" dump config --bundle="$aab" \
            | tee "$report/bundletool-config.txt"

          if ! grep -Fq 'PAGE_ALIGNMENT_16K' "$report/bundletool-config.txt"; then
            echo "::error::El AAB no solicita PAGE_ALIGNMENT_16K según bundletool"
            exit 1
          fi

          echo "PAGE_ALIGNMENT_16K" | tee "$report/bundletool-16kb.txt"
          rm -f "$bundletool_jar"

      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: archscan-android-store-${{ github.run_number }}
          path: |
            packages/room_scanner_app/build/app/outputs/bundle/release/app-release.aab
            packages/room_scanner_app/build/store-audit
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release for tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            packages/room_scanner_app/build/app/outputs/bundle/release/app-release.aab \
            packages/room_scanner_app/build/store-audit/SHA256SUMS.txt \
            packages/room_scanner_app/build/store-audit/build-identity.txt \
            --title "ARchScan ${GITHUB_REF_NAME}" \
            --generate-notes

      - name: Remove temporary credentials
        if: always()
        working-directory: packages/room_scanner_app
        shell: bash
        run: |
          rm -f android/key.properties
          rm -f android/upload-keystore.jks
 || {
            echo "::error::El AAB no contiene un bloque de firma"
            exit 1
          }

          jarsigner -verify -verbose -certs "$aab" > "$report/jarsigner-verification.txt" 2>&1 || {
            cat "$report/jarsigner-verification.txt"
            echo "::error::La firma del AAB no se pudo verificar"
            exit 1
          }

          keytool -printcert -jarfile "$aab" -v > "$report/signer-certificate.txt" 2>&1 || {
            cat "$report/signer-certificate.txt"
            echo "::error::No se pudo extraer el certificado firmante del AAB"
            exit 1
          }

          grep -Eq 'SHA256:' "$report/signer-certificate.txt" || {
            echo "::error::El certificado firmante no expone una huella SHA-256"
            exit 1
          }

          echo "Firma del AAB verificada; certificado y huella guardados en el informe."

      - name: Audit final App Bundle
        working-directory: packages/room_scanner_app
        shell: bash
        run: |
          set -euo pipefail
          aab="build/app/outputs/bundle/release/app-release.aab"
          report="build/store-audit"
          mkdir -p "$report/native"

          sha256sum "$aab" | tee "$report/SHA256SUMS.txt"
          {
            grep '^version:' pubspec.yaml
            echo "applicationId=com.bet0.ARchScan"
            echo "commit=${GITHUB_SHA}"
            echo "tag=${GITHUB_REF_NAME}"
          } | tee "$report/build-identity.txt"

          manifest="$(find build/app/intermediates -path '*release*' -name AndroidManifest.xml -type f | head -n 1)"
          if [ -z "$manifest" ]; then
            echo "::error::No se encontró el manifiesto Android fusionado"
            exit 1
          fi
          cp "$manifest" "$report/AndroidManifest.xml"
          grep -o 'uses-permission[^>]*' "$manifest" | sort -u > "$report/permissions.txt" || true

          grep -Fq 'android.permission.CAMERA' "$report/permissions.txt" || {
            echo "::error::El AAB final no declara el permiso de cámara"
            exit 1
          }

          if grep -Eq 'android.permission.(RECORD_AUDIO|INTERNET)' "$report/permissions.txt"; then
            echo "::error::El AAB contiene permisos incompatibles con la declaración de privacidad"
            exit 1
          fi

          unzip -q "$aab" 'base/lib/*/*.so' -d "$report/native"
          find "$report/native" -type f -name '*.so' | sort > "$report/native-libraries.txt"

          incompatible=0
          checked_64bit=0
          : > "$report/page-alignment-16kb.txt"
          while IFS= read -r library; do
            relative="${library#"$report/native/"}"
            alignments="$(readelf -lW "$library" | awk '$1 == "LOAD" { print $NF }')"
            printf '%s: %s\n' "$relative" "$alignments" | tee -a "$report/page-alignment-16kb.txt"

            # Google Play's 16 KB requirement applies to 64-bit devices.
            # Android's official checker evaluates arm64-v8a and x86_64;
            # armeabi-v7a remains a 4 KB/32-bit ABI and must not make the
            # release fail merely because a legacy prebuilt SDK uses 4 KB ELF
            # alignment there.
            case "$relative" in
              base/lib/arm64-v8a/*.so|base/lib/x86_64/*.so)
                checked_64bit=1
                for alignment in $alignments; do
                  if (( alignment < 0x4000 )); then
                    echo "::error::$relative usa alineación $alignment (< 0x4000)"
                    incompatible=1
                  fi
                done
                ;;
            esac
          done < "$report/native-libraries.txt"

          if [ "$checked_64bit" -eq 0 ]; then
            echo "::error::El AAB no contiene bibliotecas nativas 64-bit para validar 16 KB"
            exit 1
          fi

          if [ "$incompatible" -ne 0 ]; then
            exit 1
          fi

      - name: Validate AAB ZIP alignment with bundletool
        working-directory: packages/room_scanner_app
        shell: bash
        run: |
          set -euo pipefail
          aab="build/app/outputs/bundle/release/app-release.aab"
          report="build/store-audit"
          bundletool_version="1.18.3"
          bundletool_jar="build/bundletool-all-${bundletool_version}.jar"
          expected_sha256="a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29"

          curl --fail --location --silent --show-error \
            "https://github.com/google/bundletool/releases/download/${bundletool_version}/bundletool-all-${bundletool_version}.jar" \
            --output "$bundletool_jar"

          actual_sha256="$(sha256sum "$bundletool_jar" | awk '{print $1}')"
          if [ "$actual_sha256" != "$expected_sha256" ]; then
            echo "::error::La SHA-256 de bundletool ${bundletool_version} no coincide"
            echo "Esperada: $expected_sha256"
            echo "Obtenida: $actual_sha256"
            exit 1
          fi

          java -jar "$bundletool_jar" version | tee "$report/bundletool-version.txt"

          java -jar "$bundletool_jar" dump config --bundle="$aab" \
            | tee "$report/bundletool-config.txt"

          if ! grep -Fq 'PAGE_ALIGNMENT_16K' "$report/bundletool-config.txt"; then
            echo "::error::El AAB no solicita PAGE_ALIGNMENT_16K según bundletool"
            exit 1
          fi

          echo "PAGE_ALIGNMENT_16K" | tee "$report/bundletool-16kb.txt"
          rm -f "$bundletool_jar"

      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: archscan-android-store-${{ github.run_number }}
          path: |
            packages/room_scanner_app/build/app/outputs/bundle/release/app-release.aab
            packages/room_scanner_app/build/store-audit
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release for tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            packages/room_scanner_app/build/app/outputs/bundle/release/app-release.aab \
            packages/room_scanner_app/build/store-audit/SHA256SUMS.txt \
            packages/room_scanner_app/build/store-audit/build-identity.txt \
            --title "ARchScan ${GITHUB_REF_NAME}" \
            --generate-notes

      - name: Remove temporary credentials
        if: always()
        working-directory: packages/room_scanner_app
        shell: bash
        run: |
          rm -f android/key.properties
          rm -f android/upload-keystore.jks
