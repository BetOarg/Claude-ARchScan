name: ARchScan - Housekeeping Audit

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  housekeeping:
    name: Housekeeping — repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run housekeeping audit
        run: bash .github/scripts/housekeeping_audit.sh
