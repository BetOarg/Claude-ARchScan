name: Temporary formatter for release hardening

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/domain-export-hardening
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
      - run: |
          set -euo pipefail
          dart format packages/room_scanner_core
      - name: Commit formatted files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then exit 0; fi
          git add packages/room_scanner_core
          git commit -m "style: format room scanner core"
          git push origin HEAD:release/domain-export-hardening
