name: Bootstrap Drift Schema Snapshot

on:
  push:
    branches:
      - migration/drift-persistence
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  snapshot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.9.2'
      - name: Generate Drift migration artifacts
        working-directory: packages/room_scanner_core
        run: |
          dart pub get
          mkdir -p drift_schemas test/generated_migrations
          dart run drift_dev schema dump lib/src/persistence/drift_database.dart drift_schemas/drift_schema_v1.json
          dart run drift_dev schema generate drift_schemas/ test/generated_migrations/
      - name: Commit generated migration artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/room_scanner_core/drift_schemas packages/room_scanner_core/test/generated_migrations
          git diff --cached --quiet && exit 0
          git commit -m "test: add Drift schema migration artifacts"
          git push
