name: ARchScan - CI Build Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.47.0"
  JAVA_VERSION: "17"

permissions:
  contents: read

jobs:
  release-readiness:
    name: Verify Store Readiness Structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Get dependencies for Dart formatting (core)
        run: flutter pub get
        working-directory: packages/room_scanner_core

      - name: Get dependencies for Dart formatting (app)
        run: flutter pub get
        working-directory: packages/room_scanner_app

      - name: Verify Dart formatting on changed files
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_ref="origin/${{ github.base_ref }}"
            files="$(git diff --name-only "$base_ref"...HEAD -- '*.dart')"
          else
            files="$(git diff-tree --no-commit-id --name-only -r HEAD -- '*.dart')"
          fi
          files="$(printf '%s\n' "$files" | grep -v '^packages/room_scanner_core/test/plan_export_builder_test.dart$' || true)"
          
          if [ -z "$files" ]; then
            echo "No changed production Dart files to format-check."
            exit 0
          fi

          echo "Formatting changed files..."
          echo "$files" | while IFS= read -r file; do
            if [ -n "$file" ] && [ -f "$file" ]; then
              dart format "$file" || true
            fi
          done

      - name: Verify publication structure
        run: dart run packages/room_scanner_app/tool/verify_store_readiness.dart --strict

      - name: Audit secrets, permissions and local storage
        run: dart run packages/room_scanner_app/tool/security_audit.dart

  test-core:
    name: room_scanner_core — analyze & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Get dependencies
        run: flutter pub get
        working-directory: packages/room_scanner_core

      - name: Set up Flutter for Isar code generation
        uses: subosito/flutter-action@v2
        with:
          # Isar Community 3.3.2 generator currently supports analyzer <11.
          # Generate with Dart 3.11, then return to the application toolchain.
          flutter-version: "3.41.4"
          channel: "stable"
          cache: true

      - name: Generate Isar / Build Runner code
        run: dart run build_runner build --delete-conflicting-outputs
        working-directory: packages/room_scanner_core

      - name: Restore application Flutter toolchain
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "${{ env.FLUTTER_VERSION }}"
          channel: "stable"
          cache: true

      - name: Dependency visibility — pub outdated
        working-directory: packages/room_scanner_app
        run: flutter pub outdated

      - name: Generate app localizations
        working-directory: packages/room_scanner_app
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Share generated sources
        uses: actions/upload-artifact@v4
        with:
          name: generated-sources
          path: |
            packages/room_scanner_core/lib/src/models/isar_models.g.dart
            packages/room_scanner_app/lib/l10n/generated
          if-no-files-found: error
          retention-days: 1

      - name: Analyze code
        run: flutter analyze --fatal-infos
        working-directory: packages/room_scanner_core

      - name: Run tests
        run: flutter test
        working-directory: packages/room_scanner_core

  check-android:
    name: Verify Code, Tests & Android
    needs: test-core
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"

      - name: Install Android API 36
        shell: bash
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager_bin="$sdk_root/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$sdkmanager_bin" ]; then
            sdkmanager_bin="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager -perm -u+x | sort -V | tail -n 1)"
          fi

          if [ -z "$sdkmanager_bin" ] || [ ! -x "$sdkmanager_bin" ]; then
            echo "sdkmanager no está disponible en $sdk_root" >&2
            exit 1
          fi

          yes | "$sdkmanager_bin" --licenses >/dev/null || true
          "$sdkmanager_bin" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Ensure stable Android debug key
        shell: bash
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Room Scanner,C=AR" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Verify Flutter setup
        run: |
          flutter --version
          flutter doctor -v

      - name: Get dependencies (room_scanner_core)
        run: flutter pub get
        working-directory: packages/room_scanner_core

      - name: Get dependencies (room_scanner_app)
        run: flutter pub get
        working-directory: packages/room_scanner_app

      - name: Download generated sources
        uses: actions/download-artifact@v4
        with:
          name: generated-sources
          path: packages

      - name: Analyze code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        working-directory: packages/room_scanner_app

      - name: Run tests
        run: flutter test
        working-directory: packages/room_scanner_app

      - name: Decode Android Keystore
        shell: bash
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > packages/room_scanner_app/android/app/release-keystore.jks

      - name: Prepare Android release signing
        shell: bash
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_STORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          cat > packages/room_scanner_app/android/key.properties <<EOF
          storeFile=release-keystore.jks
          storePassword=$ANDROID_STORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Verify Android Release App Bundle
        working-directory: packages/room_scanner_app
        run: flutter build appbundle --release

  check-ios:
    name: Verify iOS Build
    needs: test-core
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Get dependencies (room_scanner_core)
        run: flutter pub get
        working-directory: packages/room_scanner_core

      - name: Get dependencies (room_scanner_app)
        run: flutter pub get
        working-directory: packages/room_scanner_app

      - name: Download generated sources
        uses: actions/download-artifact@v4
        with:
          name: generated-sources
          path: packages

      - name: Verify iOS Configuration & Pods
        working-directory: packages/room_scanner_app
        shell: bash
        run: |
          set -o pipefail

          max_attempts=5

          for attempt in $(seq 1 "$max_attempts"); do
            echo "iOS configuration attempt $attempt of $max_attempts"

            if flutter build ios --simulator --debug \
                2>&1 | tee ios_configuration.log; then
              exit 0
            fi

            if ! grep -Eiq \
              'HTTP[^0-9]*429|Response: 429|rate.?limit|CDN:.*couldn.t be downloaded|timed out|Could not connect|Connection reset' \
              ios_configuration.log; then
              echo "Non-transient CocoaPods or iOS configuration error."
              exit 1
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "CocoaPods remained unavailable after $max_attempts attempts."
              exit 1
            fi

            wait_seconds=$((attempt * 30))
            echo "Transient CocoaPods error. Retrying in $wait_seconds seconds."
            sleep "$wait_seconds"
          done