name: room_scanner_core
description: >
  Núcleo de dominio de Claude Room Scanner: modelos de dominio, persistencia Drift, geometría de
  ambientes/paredes compartidas y construcción de exportaciones JSON/PDF.
  Sin UI, sin widgets, sin controladores de hardware.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: '>=3.0.0 <4.0.0'
  # Sin "flutter:" — es un paquete Dart puro. Ninguna dependencia de acá
  # requiere el SDK de Flutter para compilar.

dependencies:
  # Persistencia relacional local sobre SQLite.
  drift: ^2.35.0

  # Matemáticas vectoriales para los puntos 3D del plano.
  vector_math: ^2.1.4

  # Generación de documentos PDF — paquete Dart puro, sin dependencia de
  # Flutter. La impresión/guardado real (package:printing) queda en la app.
  pdf: ^3.10.8

dev_dependencies:
  test: ^1.25.0
  lints: ^3.0.0

  build_runner: ^2.11.1
  drift_dev: ^2.35.0
