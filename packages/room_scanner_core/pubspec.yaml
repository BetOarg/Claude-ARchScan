name: room_scanner_core
description: >
  Núcleo de dominio de Claude Room Scanner: modelos Isar, geometría de
  ambientes/paredes compartidas y construcción de exportaciones JSON/PDF.
  Sin UI, sin widgets, sin controladores de hardware.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: '>=3.0.0 <4.0.0'
  # Sin "flutter:" — es un paquete Dart puro. Ninguna dependencia de acá
  # requiere el SDK de Flutter para compilar.

dependencies:
  # Base de datos local NoSQL. Los binarios nativos 16 KB se aportan
  # mediante isar_community_flutter_libs en la app.
  isar_community: ^3.3.2

  # Matemáticas vectoriales para los puntos 3D del plano.
  vector_math: ^2.1.4

  # Generación de documentos PDF — paquete Dart puro, sin dependencia de
  # Flutter. La impresión/guardado real (package:printing) queda en la app.
  pdf: ^3.10.8

dev_dependencies:
  test: ^1.25.0
  lints: ^3.0.0

  # Generador de código compatible con el fork comunitario de Isar.
  # 2.11.1 mantiene el modo de compilación anterior al cambio a AOT.
  build_runner: 2.11.1
  isar_community_generator: ^3.3.2

  # SOLO dev_dependency: habilita abrir una instancia real de Isar en tests
  # locales de integración de este paquete.
  isar_community_flutter_libs: ^3.3.2
