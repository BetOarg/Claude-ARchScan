name: room_scanner_core
description: >
  Núcleo de dominio de ARchScan: modelos, geometría, persistencia Drift y
  construcción de exportaciones JSON/PDF. Sin UI, sin widgets, sin
  controladores de hardware.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  drift: ^2.35.0
  sqlite3: ^3.5.2
  vector_math: ^2.1.4
  pdf: ^3.10.8

dev_dependencies:
  test: ^1.25.0
  lints: ^3.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.16.1
