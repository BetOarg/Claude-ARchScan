name: room_scanner_ar
description: "Aplicación de escaneo de habitaciones en Realidad Aumentada y generación de planos 2D."
publish_to: 'none'
version: 2.7.0+4

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter

  # Localización oficial de Flutter
  flutter_localizations:
    sdk: flutter
  intl: 0.20.3

  # Núcleo de dominio: modelos, geometría, Isar y construcción de
  # exportaciones. Durante la fase de monorepo se resuelve por path; tras
  # el split físico a un repositorio propio pasa a resolverse por git (o
  # por un servidor pub privado si se decide publicarlo).
  room_scanner_core:
    path: ../room_scanner_core
    # git:
    #   url: https://github.com/BetOarg/room_scanner_core.git
    #   ref: v1.0.0

  # Módulo AR
  ar_flutter_plugin_2: ^0.0.3

  # Cámara para Basic Scanner sin ARCore/ARKit
  camera: ^0.10.5+9

  # Sensores IMU: acelerómetro, giroscopio y magnetómetro
  sensors_plus: ^3.0.3

  # Matemáticas vectoriales para los nodos 3D — usado directamente en
  # scanner/adapters/ar_scanner_adapter.dart y scanner/utils/ar_stability_filter.dart
  vector_math: ^2.1.4

  # Gestión de estado
  provider: ^6.1.2

  # Preferencias locales de interfaz
  shared_preferences: 2.3.5

  # Selector de archivos (Importación JSON)
  file_picker: ^8.0.0

  # Impresión e intercambio de archivos. Ya no requiere el paquete "pdf"
  # directo: recibe el pw.Document ya armado desde room_scanner_core.
  printing: ^5.13.1
  share_plus: ^10.0.0
  path_provider: ^2.1.2

  # Binarios nativos de Isar. Viven exclusivamente acá: room_scanner_core
  # solo declara el paquete "isar" (anotaciones/runtime), no sus binarios.
  isar_flutter_libs: ^3.1.0+1

  # Logotipo vectorial oficial de ARchScan
  flutter_svg: ^2.0.10+1

  # Codificación JPG del plano rasterizado; PNG se obtiene del motor Flutter.
  image: ^4.2.0

  # Permiso de cámara en tiempo de ejecución
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  shared_preferences_platform_interface: ^2.4.0
  integration_test:
    sdk: flutter

flutter:
  config:
    enable-swift-package-manager: false
  generate: true
  uses-material-design: true

  assets:
    # Modelos e imágenes en assets/models/
    - assets/models/sphere.gltf
    - assets/models/images.png
    - assets/images/archscan_logo.svg

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-VariableFont_wght.ttf
