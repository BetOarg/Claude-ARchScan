plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// Carga segura de variables desde local.properties o valores por defecto
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')

if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode =
        localProperties.getProperty('flutter.versionCode') ?: '1'

def flutterVersionName =
        localProperties.getProperty('flutter.versionName') ?: '1.0'

// Firma de release
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
def hasReleaseKeystore = keystorePropertiesFile.exists()

if (hasReleaseKeystore) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

android {
    namespace "com.bet0.ARchScan"

    compileSdkVersion 36
    ndkVersion "28.2.13676358"

    // Alineación nativa de 16 KB para bibliotecas ELF en Android 15+.
    experimentalProperties["android.nativeLibraryAlignmentPageSize"] = "16k"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId "com.bet0.ARchScan"

        minSdkVersion 28

        targetSdkVersion 36

        versionCode flutterVersionCode.toInteger()

        versionName flutterVersionName
    }

    signingConfigs {
        // Clave de pruebas ya pública en el repositorio. Nunca usar en release.
        // La ruta explícita evita depender del debug.keystore del runner.
        debug {
            def testKeySource = rootProject.file(
                    '../../../.github/signing/room-scanner-test.keystore.b64')
            if (!testKeySource.isFile()) {
                throw new GradleException('Falta la clave fija de pruebas.')
            }
            def testKeyFile = rootProject.file(
                    '.gradle/archscan-signing/debug.keystore')
            def testKeyBytes = java.util.Base64.getMimeDecoder().decode(
                    testKeySource.getText('UTF-8'))
            if (!testKeyFile.isFile() ||
                    !java.util.Arrays.equals(testKeyFile.bytes, testKeyBytes)) {
                testKeyFile.parentFile.mkdirs()
                testKeyFile.bytes = testKeyBytes
            }

            storeFile testKeyFile
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasReleaseKeystore) {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']

                storeFile keystoreProperties['storeFile']
                        ? file(keystoreProperties['storeFile'])
                        : null

                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Una compilación sin key.properties queda deliberadamente sin
            // firma. Nunca se reutiliza la clave de depuración para publicar.
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }

            // Validamos R8 en el AAB de release antes de publicar.
            // Las reglas del proyecto mantienen únicamente lo que necesita
            // reflexión/serialización y el stack de plugins nativos.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile(
                    'proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }
}

tasks.register("verifyProductionSigning") {
    group = "verification"
    description = "Verifica la configuración de la clave de carga de producción."

    doLast {
        if (!hasReleaseKeystore) {
            throw new GradleException(
                    "Falta android/key.properties para la firma de producción.")
        }

        def requiredKeys = [
                'storeFile',
                'storePassword',
                'keyAlias',
                'keyPassword',
        ]

        def missingKeys = requiredKeys.findAll {
            !keystoreProperties[it]?.trim()
        }

        if (!missingKeys.isEmpty()) {
            throw new GradleException(
                    "Faltan propiedades de firma: ${missingKeys.join(', ')}")
        }

        def releaseStore = file(keystoreProperties['storeFile'])

        if (!releaseStore.exists()) {
            throw new GradleException(
                    "No existe el keystore indicado: ${releaseStore}")
        }

        // Comprueba las credenciales reales del almacén y de la clave privada.
        // No se imprimen contraseñas ni contenido sensible en los logs de CI.
        def storePassword = keystoreProperties['storePassword'].toCharArray()
        def keyPassword = keystoreProperties['keyPassword'].toCharArray()
        def keyAlias = keystoreProperties['keyAlias']
        java.security.KeyStore loadedStore = null

        ['JKS', 'PKCS12'].each { storeType ->
            if (loadedStore == null) {
                try {
                    def candidate = java.security.KeyStore.getInstance(storeType)
                    releaseStore.withInputStream { stream ->
                        candidate.load(stream, storePassword)
                    }
                    loadedStore = candidate
                } catch (Exception ignored) {
                    // Prueba el siguiente formato sin exponer detalles sensibles.
                }
            }
        }

        if (loadedStore == null) {
            throw new GradleException(
                    "No se pudo abrir el keystore con las credenciales configuradas.")
        }

        try {
            def privateKey = loadedStore.getKey(keyAlias, keyPassword)
            def certificateChain = loadedStore.getCertificateChain(keyAlias)
            if (!(privateKey instanceof java.security.PrivateKey) ||
                    certificateChain == null || certificateChain.length == 0) {
                throw new GradleException(
                        "El alias configurado no contiene una clave privada con certificado.")
            }
        } catch (GradleException exception) {
            throw exception
        } catch (Exception ignored) {
            throw new GradleException(
                    "No se pudo desbloquear la clave privada con las credenciales configuradas.")
        }

        println "Almacén, alias y clave privada de producción verificados."
    }
}

flutter {
    source '../../'
}

dependencies {

    // ar_flutter_plugin_2 still targets the SceneView 2.x API. Version 2.3.3
    // is the latest 2.x release and is kept as a matched pair for both AR and
    // 3D artifacts; newer 4.x releases are API-incompatible with the plugin.
    configurations.all {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'io.github.sceneview' &&
                    (details.requested.name == 'arsceneview' ||
                     details.requested.name == 'sceneview')) {
                details.useVersion('2.3.3')
                details.because('Keep ar_flutter_plugin_2 on the compatible SceneView 2.x API')
            }
        }
    }

    // ================================================================
    // ANDROIDX
    // ================================================================

    implementation 'androidx.appcompat:appcompat:1.6.1'

    // ================================================================
    // GOOGLE ARCORE
    // ================================================================
    //
    // Se utiliza para detectar correctamente si el dispositivo
    // Android soporta ARCore mediante ArCoreApk.
    //
    // IMPORTANTE:
    // Esta dependencia no obliga a que el dispositivo tenga ARCore.
    // Permite consultar su disponibilidad en tiempo de ejecución.
    //
    implementation 'com.google.ar:core:1.54.0'
}
